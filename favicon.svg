<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <rect width="600" height="600" fill="none"/>
  <g transform="translate(300,300) rotate(-45)"
     fill="none" stroke="#000" stroke-width="24"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- glass body -->
    <rect x="-150" y="-42" width="300" height="84" rx="10"/>
    <!-- end caps -->
    <rect x="-232" y="-52" width="86" height="104" rx="22"/>
    <rect x="146" y="-52" width="86" height="104" rx="22"/>
    <!-- zigzag filament -->
    <polyline points="-150,0 -120,-30 -90,30 -60,-30 -30,30 0,-30 30,30 60,-30 90,30 120,-30 150,0"
              stroke-width="16"/>
  </g>
</svg>
