<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script src='https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js'></script>

<title>Don't Blow It</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<!-- Bump ?v= on every deploy that touches css/js so cached copies can't be served -->
<link rel="stylesheet" href="style.css?v=2026-07-06d">
</head>
<body>
<div class="container">
	<div id="page-header" class="mb-4">
    	<h1>MakeSafe Tools - Fuse & Overload Chart</h1>
  	</div>
	<div id="page-body" class="row">
		<div id="sidebar" class="col-md-3">
			<div class="card">
				<div id="sidebar-header" class="card-header">Coordination Study</div>
				<div id="sidebar-body" class="card-body">
					<div class="study-section mb-3">
						<div class="section-title">Study Setup</div>
						<label class="form-label small mb-1" for="fla">Motor FLA (amps)</label>
						<input type="number" class="form-control form-control-sm" id="fla" min="0.1" step="any" value="1">
						<div class="invalid-feedback">Enter a positive number of amps.</div>
						<div id="flaList" class="mt-2">
							<!-- FLA reference checkboxes are dynamically added here -->
						</div>
					</div>
					<div class="study-section mb-3">
						<div class="section-title">Protected Devices</div>
						<div id="protectedList">
							<!-- Protected component groups are dynamically added here -->
						</div>
					</div>
					<div class="study-section mb-3">
						<div class="section-title">Candidates</div>
						<div id="overloadList">
							<!-- Candidate device groups are dynamically added here -->
						</div>
					</div>
					<button class="btn btn-sm btn-secondary" onclick="resetStudy()">Reset Study</button>
				</div>
			</div>
		</div>
		<div id="content" class="col-md-9">
			<div class="card">
				<div class="card-header">Chart</div>
				<div class="card-body">
					<canvas id="myChart" width="400" height="400"></canvas>
					<div class="mt-3">
						<div class="row">
							<div class="col-md-6">
								<label class="form-label">Axis Scale:</label>
								<div class="form-check">
									<input type="checkbox" class="form-check-input" id="xAxisLog" checked>
									<label class="form-check-label" for="xAxisLog">Logarithmic X-Axis (Time)</label>
								</div>
								<div class="form-check">
									<input type="checkbox" class="form-check-input" id="yAxisLog" checked>
									<label class="form-check-label" for="yAxisLog">Logarithmic Y-Axis (Current)</label>
								</div>
							</div>
							<div class="col-md-6">
								<label class="form-label">Axis Ranges (leave empty for auto):</label>
								<div class="row g-2 mb-2">
									<div class="col-6">
										<label class="form-label small">Time Range (X-Axis)</label>
										<div class="input-group input-group-sm">
											<input type="number" class="form-control" id="xMin" placeholder="Min">
											<input type="number" class="form-control" id="xMax" placeholder="Max" value="1000">
										</div>
									</div>
									<div class="col-6">
										<label class="form-label small">Current Range (Y-Axis)</label>
										<div class="input-group input-group-sm">
											<input type="number" class="form-control" id="yMin" placeholder="Min">
											<input type="number" class="form-control" id="yMax" placeholder="Max" value="2000">
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>

<script type="text/javascript" src='data_types.js?v=2026-07-06d'></script>
<script type="text/javascript" src='index.js?v=2026-07-06d'></script>

</body>
</html>
